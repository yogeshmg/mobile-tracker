onAuthStateChanged(auth,async u=>{U=u;OWN=false;OK=false;P=[];S=[];M1.clear();M2.clear();
 if(u){try{const o=await getDoc(doc(db,"meta","owner"));

 const tot=S.reduce((a,s)=>a+pf(s),0),mo=S.filter(s=>(s.date||"").startsWith(ms)).reduce((a,s)=>a+pf(s),0),cm=S.reduce((a,s)=>a+(+s.comm||0),0),sum=(f)=>inr(S.filter(f).reduce((a,s)=>a+ +s.sup,0));

function dl(name,rows){const csv="\ufeff"+rows.map(a=>a.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("फ़ाइल तैयार")}

function addStaff(){const e=($("#se").value||"").trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){toast("सही ईमेल भरें");return}setDoc(doc(db,"staffEmails",e),{at:today()}).then(()=>toast("स्टाफ़ जुड़ गया")).catch(()=>toast("नहीं हो पाया"))}

async function doUp(file){if(!file)return;busy=true;pr=0;res("");$(".pg").style.display="block";
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});

  const H=rows[hi].map(c=>String(c).toLowerCase()),ix=k=>H.findIndex(c=>c.includes(k)),cI=ix("imei")>=0?ix("imei"):ix("serial"),mI=ix("model"),dI=ix("inward"),aI=H.findIndex(c=>c=="age");

   if(v.length<14||v.length>16||seen.has(v))continue;seen.add(v);items.push({id:v,model:r[mI]||"",inward:r[dI]||"",age:+r[aI]||0})}

  for(let i=0;i<cand.length;i+=20){const ch=cand.slice(i,i+20),ex=await Promise.all(ch.map(c=>getDoc(doc(db,"purchases",c.id))));ch.forEach((c,k)=>{if(!ex[k].exists())nw.push(c)})}
  for(let i=0;i<nw.length;i+=400){const b=writeBatch(db);nw.slice(i,i+400).forEach(n=>b.set(doc(db,"purchases",n.id),{model:n.model,inward:n.inward,age:n.age,added:today(),st:"in"}));await b.commit();pr=Math.round(Math.min(nw.length,i+400)/nw.length*100);const pb=$("#pb");if(pb)pb.style.width=pr+"%"}

 }catch(e){res(`<div class="card"><span class="bd r">फ़ाइल नहीं पढ़ी जा सकी</span><p class="sub">${esc(e.message||e)}</p></div>`)}
 busy=false;const g=$(".pg");if(g)g.style.display="none";const f=$("#f");if(f)f.value=""}
